version = 3.8.4
runner.dialect = scala213
maxColumn = 100
rewrite.rules = [RedundantBraces, SortModifiers]

# Align consecutive Scala definitions/assignments and SpinalHDL assignments.
align.multiline = false
align.tokens."+" = [
  { code = "=", owner = "(Enumerator.Val|Defn.(Val|Var|Def)|Term.Assign)" },
  { code = ":=", owner = "Term.ApplyInfix" },
  { code = "#=", owner = "Term.ApplyInfix" }
]
