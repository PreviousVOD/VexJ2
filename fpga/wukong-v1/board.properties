# Shared hardware/firmware/build configuration. Flash addresses are byte offsets.
name=wukong-v1
part=xc7a100tfgg676-2
inputClockHz=50000000
clockHz=72000000
usePll=1
uartDevice=/dev/ttyUSB0
uartBaud=19200
sciBase=0xff001000
cmtBase=0xff003000
flashType=micron
flashBytes=0x02000000
configurationFlashBytes=0x01000000
configurationSlotBytes=0x00400000
flashOffset=0x00000000
xipBase=0x10000000
xipBytes=0x00100000
memoryType=ddr3
memoryBase=0x80000000
memoryBytes=0x10000000
sramBytes=0x00008000

# FPGA build flow. Board-owned build.tcl sources the vendor workflow.
vendor=xilinx
generator=j2.Generate_Wukong
top=j2_wukong_v1
pinConstraints=pins.xdc
jtagPart=xc7a100t*

# INTC source index is the position in this board-owned list; vector = 64 + index.
interruptSources=CMT0,CMT1,SCI_ERI,SCI_RXI,SCI_TXI,SCI_TEI
