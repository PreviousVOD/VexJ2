# Shared hardware/firmware/build configuration. Flash addresses are byte offsets.
name=tang-primer
part=EG4S20BG256
inputClockHz=24000000
clockHz=32000000
usePll=1
uartDevice=/dev/ttyACM0
uartBaud=19200
flashType=winbond
flashBytes=0x01000000
configurationFlashBytes=0
configurationSlotBytes=0
flashOffset=0x00000000
xipBase=0x10000000
xipBytes=0x00100000
memoryType=sdram
memoryBase=0x80000000
memoryBytes=0x00800000
sramBytes=0x00008000

# FPGA build flow. Board-owned build.tcl sources the vendor workflow.
vendor=anlogic
generator=j2.Generate_TangPrimer
top=j2_tang_primer
rtlDirectory=build/spinal/verilog-fpga
buildDirectory=build/fpga/tang-primer
reportDirectory=build/logs/td_verilog
rtlSources=J2MicrocodedCore.v,j2_tang_primer.v
projectFile=j2_tang_primer.al
pinConstraints=j2_tang_primer.adc
timingTemplate=j2_tang_primer.sdc.in
clockHzEnv=J2_CLOCK_HZ
usePllEnv=J2_USE_PLL
